name: Build and test Windows plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official compile-only SDK
        shell: powershell
        run: ./scripts/fetch-sdk.ps1
      - name: Compile and test
        shell: powershell
        run: ./scripts/build.ps1 -ParatextDir artifacts/sdk -BuildNumber ${{ github.run_number }}
      - name: Verify build and package source integrity
        shell: powershell
        run: ./tests/BuildIntegrity.Tests.ps1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate C# finding export against original schema
        shell: powershell
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/validate-export.py
      - name: Package plugin without host assemblies or project data
        shell: powershell
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: TamilSandhiQA-development-build
          path: |
            artifacts/TamilSandhiQA-*.zip
            artifacts/build/test-results.json
